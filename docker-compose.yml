services:
  pi-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      HOST: "0.0.0.0"
      PORT: "3069"
      HOME: "${HOME}"
      PATH: "/host-pi-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    ports:
      - "33647:3069"
    volumes:
      - "${HOME}:${HOME}"
      - "${PI_BINARY_DIR:-/dev/null}:/host-pi-bin:ro"
    # The image runs as the container's default user. Under rootless Podman
    # that user is mapped to the host caller, so host bind mounts stay writable.
