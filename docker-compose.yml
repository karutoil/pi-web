# All tunables live in .env (gitignored). docker compose auto-loads ./.env for
# ${VAR} interpolation. Every var has a `:-default` so `docker compose up`
# still boots localhost-dev mode with no .env present — .env only overrides.
services:
  pi-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      HOST: "${HOST:-0.0.0.0}"
      PORT: "${PORT:-3069}"
      HOME: "${HOME}"
      # Container-internal PATH (host pi binary + node_modules bin first).
      PATH: "/host-pi-bin:/app/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      # Container's pi-web DB — separate from local dev's ~/.pi-web/.pi-web.db so
      # dev test accounts/sessions never leak into the exposed container.
      PI_WEB_DB_PATH: "${HOME}/.pi-web/.pi-web.docker.db"
      # ── Auth (better-auth). Auto-on when HOST is not loopback;
      # PI_WEB_AUTH=off forces open (NOT recommended for an exposed port).
      PI_WEB_AUTH: "${PI_WEB_AUTH:-on}"
      PI_WEB_ADMIN_EMAIL: "${PI_WEB_ADMIN_EMAIL:-admin@local.test}"
      # Unset/blank → a random password is generated and printed ONCE on first run.
      PI_WEB_ADMIN_PASSWORD: "${PI_WEB_ADMIN_PASSWORD:-}"
      # ── TLS / domain deployments — set these in .env:
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-}"
      PI_WEB_SECURE_COOKIES: "${PI_WEB_SECURE_COOKIES:-}"
      PI_WEB_ORIGIN: "${PI_WEB_ORIGIN:-}"
    ports:
      - "${HOST_PORT:-33647}:${PORT:-3069}"
    volumes:
      - "${HOME}:${HOME}"
      - "${PI_BINARY_DIR:-/dev/null}:/host-pi-bin:ro"
    # The image runs as the container's default user. Under rootless Podman
    # that user is mapped to the host caller, so host bind mounts stay writable.
