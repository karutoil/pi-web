<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PI Web</title>
    <meta name="description" content="AI coding assistant with terminal, git, and file management" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />

    <!-- Theme color (matches manifest) -->
    <meta name="theme-color" content="#d4a020" />
    <meta name="color-scheme" content="dark" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="PI" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- Android PWA support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="PI Web" />

    <!-- Splash screens for iOS (generated via manifest) -->
    <link rel="apple-touch-startup-image" href="/icons/icon-512x512.png" />

    <!-- Safe area insets for notched devices -->
    <style>
      :root {
        --safe-area-top: env(safe-area-inset-top, 0px);
        --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-left: env(safe-area-inset-left, 0px);
        --safe-area-right: env(safe-area-inset-right, 0px);
      }
    </style>

    <!-- Theme: apply before paint to avoid flash. Reads the server-injected
         window.__PI_WEB_SETTINGS__ (DB-backed) — no localStorage. -->
    <script>
      (function(){try{var s=window.__PI_WEB_SETTINGS__;var t=s&&s["pi-web-theme"];if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();
    </script>

    <!-- Service worker registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function() {
          navigator.serviceWorker.register("/sw.js", { scope: "/" }).then(function(reg) {
            reg.addEventListener("updatefound", function() {
              var newWorker = reg.installing;
              newWorker.addEventListener("statechange", function() {
                if (newWorker.state === "activated") {
                  // Notify app about available update
                  window.dispatchEvent(new CustomEvent("sw-update", { detail: reg }));
                }
              });
            });
          }).catch(function(err) {
            console.warn("SW registration failed:", err);
          });
        });
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght,0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Geist+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
