<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ink-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#17120e"/>
      <stop offset="60%" stop-color="#0d0a07"/>
      <stop offset="100%" stop-color="#070503"/>
    </radialGradient>
    <linearGradient id="amber-seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d060"/>
      <stop offset="35%" stop-color="#d9a316"/>
      <stop offset="65%" stop-color="#c08d0e"/>
      <stop offset="100%" stop-color="#a07508"/>
    </linearGradient>
    <radialGradient id="impression-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a020" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#d4a020" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#d4a020" stop-opacity="0"/>
    </radialGradient>
    <filter id="amber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="glow"/>
      <feColorMatrix in="glow" type="matrix" values="1 0 0 0 0.1  0 0.8 0 0 0.05  0 0 0.2 0 0  0 0 0 0.5 0" result="colored-glow"/>
      <feMerge>
        <feMergeNode in="colored-glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="letterpress" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.6" specularExponent="25" result="spec">
        <fePointLight x="200" y="100" z="300"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="spec-out"/>
      <feComposite in="SourceGraphic" in2="spec-out" operator="arithmetic" k1="0" k2="1" k3="0.4" k4="0"/>
    </filter>
    <clipPath id="round-clip">
      <rect width="512" height="512" rx="108"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round-clip)">
    <rect width="512" height="512" fill="url(#ink-bg)"/>
    <!-- Seal ring -->
    <circle cx="256" cy="256" r="200" fill="none" stroke="url(#amber-seal)" stroke-width="3" opacity="0.7"/>
    <circle cx="256" cy="256" r="192" fill="none" stroke="#d4a020" stroke-width="1" opacity="0.25"/>
    <circle cx="256" cy="256" r="190" fill="url(#impression-glow)"/>
    <!-- Arrow logo mark — the PI symbol -->
    <g filter="url(#amber-glow)" opacity="0.3">
      <path d="M170 290 L256 210 L342 290" stroke="#e8b830" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M256 210 L256 360" stroke="#e8b830" stroke-width="18" stroke-linecap="round" fill="none"/>
    </g>
    <g filter="url(#letterpress)">
      <path d="M170 290 L256 210 L342 290" stroke="url(#amber-seal)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M256 210 L256 360" stroke="url(#amber-seal)" stroke-width="16" stroke-linecap="round" fill="none"/>
    </g>
    <circle cx="256" cy="360" r="12" fill="#f5c842"/>
    <!-- Compass ticks -->
    <line x1="256" y1="48" x2="256" y2="62" stroke="#d9a316" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <line x1="256" y1="450" x2="256" y2="464" stroke="#d9a316" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <line x1="48" y1="256" x2="62" y2="256" stroke="#d9a316" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <line x1="450" y1="256" x2="464" y2="256" stroke="#d9a316" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <line x1="112" y1="112" x2="121" y2="121" stroke="#c08d0e" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
    <line x1="400" y1="112" x2="391" y2="121" stroke="#c08d0e" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
    <line x1="112" y1="400" x2="121" y2="391" stroke="#c08d0e" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
    <line x1="400" y1="400" x2="391" y2="391" stroke="#c08d0e" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
    <!-- Registration marks -->
    <g opacity="0.2" stroke="#d4a020" stroke-width="1" fill="none">
      <line x1="32" y1="32" x2="52" y2="32"/><line x1="32" y1="32" x2="32" y2="52"/>
      <line x1="480" y1="32" x2="460" y2="32"/><line x1="480" y1="32" x2="480" y2="52"/>
      <line x1="32" y1="480" x2="52" y2="480"/><line x1="32" y1="480" x2="32" y2="460"/>
      <line x1="480" y1="480" x2="460" y2="480"/><line x1="480" y1="480" x2="480" y2="460"/>
    </g>
  </g>
  <rect width="512" height="512" rx="108" fill="none" stroke="#d4a020" stroke-width="1" opacity="0.15"/>
</svg>
