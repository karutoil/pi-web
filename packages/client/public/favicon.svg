<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Amber glow for favicon legibility -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1510"/>
      <stop offset="100%" stop-color="#0d0a07"/>
    </radialGradient>
    <linearGradient id="pi-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="50%" stop-color="#d9a316"/>
      <stop offset="100%" stop-color="#c08d0e"/>
    </linearGradient>
  </defs>
  <!-- Rounded dark background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Subtle amber border -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="#d4a020" stroke-width="0.5" opacity="0.4"/>
  <!-- π character — simplified for small sizes -->
  <text x="16" y="23.5" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="url(#pi-grad)" text-anchor="middle">π</text>
</svg>
